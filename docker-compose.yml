services:
  db:
    image: postgres:16-alpine
    container_name: punchbook_db
    environment:
      POSTGRES_DB: punchbook_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: punchbook_redis
    # Port not exposed to host — backend reaches Redis via internal Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: punchbook_backend
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: 'true'
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: supersecretjwtkeyforpunchbookmvp2026
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: punchbook_frontend
    environment:
      # Browser on the host calls the published backend port
      VITE_GRAPHQL_API_URL: http://localhost:3000/graphql
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
